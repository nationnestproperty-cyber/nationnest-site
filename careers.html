<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมัครงาน — NationNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head><body>
<header class="site-header"><div class="container header-inner">
  <a class="brand" href="index.html"><img class="logo" src="assets/logo.svg" alt="NationNest"><h3 style="margin:0 0 0 6px;">NationNest <span style="color:var(--gold)">CROWN GOLD</span></h3></a>
  <nav class="main-nav"><a class="pill" href="index.html#listings">ประกาศ</a><a class="pill" href="about.html">เกี่ยวกับเรา</a><a class="pill" href="careers.html">สมัครงาน</a></nav>
</div></header>

<section class="section"><div class="container">
  <h1>ร่วมทีม NationNest</h1>
  <p style="color:#475569">รับสมัคร Sales Agent และ Frontend</p>
  <form id="jobForm" class="modal" style="margin-top:16px;padding:16px;background:#fff;border-radius:14px">
    <h3>กรอกใบสมัคร</h3>
    <div class="form-row">
      <label>ตำแหน่ง<select name="role"><option>Sales Agent</option><option>Frontend Engineer</option><option>Partnerships</option></select></label>
      <label>จังหวัด<select name="province"><option>กรุงเทพมหานคร</option><option>เชียงใหม่</option><option>ภูเก็ต</option><option>ชลบุรี</option></select></label>
      <label>ชื่อ-สกุล<input name="name" required></label>
      <label>อีเมล<input name="email" type="email" required></label>
      <label>โทร/ไลน์<input name="phone" required></label>
      <label>ลิงก์เรซูเม่/พอร์ต<input name="cv"></label>
    </div>
    <label>ข้อความเพิ่มเติม<textarea name="msg" rows="3"></textarea></label>
    <button class="pill primary" type="submit">ส่งใบสมัคร</button>
    <p id="jobMsg" class="calc-note"></p>
  </form>
</div></section>

<footer class="footer"><div class="container">© <span id="year"></span> NationNest</div></footer>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
document.getElementById('jobForm').addEventListener('submit',e=>{e.preventDefault(); document.getElementById('jobMsg').textContent='ส่งใบสมัครแล้ว (เดโม)'; e.target.reset();});
</script>
</body></html>
